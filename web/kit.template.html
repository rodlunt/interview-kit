<!doctype html>
<html lang="en-AU">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Interview Kit</title>
<style>
  :root{--ink:#16202E;--dim:#5A6779;--line:#DDE3EC;--page:#fff;--panel:#F5F7FA;
        --blue:#1F6FD0;--blue-soft:#EAF2FC;--red:#B3261E;--amber:#B4740A;
        --amber-soft:#FDF4E3;--green:#1B7A4B}
  *{box-sizing:border-box;margin:0;padding:0}
  body{background:var(--page);color:var(--ink);font:17px/1.6 system-ui,-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;-webkit-text-size-adjust:100%}
  .wrap{max-width:820px;margin:0 auto;padding:24px 17px 120px}
  h1{font-size:25px;letter-spacing:-.01em} h2{font-size:19px;margin-top:30px}
  p{margin-top:12px} .lede{color:var(--dim)} .small{font-size:14px;color:var(--dim)}
  .box{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:15px 17px;margin-top:16px}
  .box.info{background:var(--blue-soft);border-color:#C6DDF7}
  .box.warn{background:var(--amber-soft);border-color:#E8CE95}
  blockquote{margin-top:10px;padding-left:13px;border-left:3px solid var(--blue);font-style:italic}
  label.fld{display:block;margin-top:16px;font-size:14px;font-weight:600;color:var(--dim)}
  input[type=text],textarea{width:100%;padding:12px;font:inherit;font-size:16px;margin-top:7px;
    border:1px solid var(--line);border-radius:10px;background:#fff;color:var(--ink)}
  textarea{min-height:120px;resize:vertical}
  input:focus,textarea:focus,button:focus-visible{outline:2px solid var(--blue);outline-offset:1px}
  button{font:inherit;font-weight:700;padding:12px 17px;border-radius:10px;border:1px solid var(--line);
    background:#fff;color:var(--ink);cursor:pointer;margin-top:12px}
  button.primary{background:var(--blue);color:#fff;border-color:var(--blue)}
  button.danger{background:var(--red);color:#fff;border-color:var(--red)}
  button:disabled{opacity:.5;cursor:default}
  .row{display:flex;gap:10px;flex-wrap:wrap}
  .steps{display:flex;gap:6px;flex-wrap:wrap;margin-top:14px}
  .steps span{font-size:12px;font-weight:700;padding:5px 10px;border-radius:20px;background:var(--panel);color:var(--dim)}
  .steps span.on{background:var(--blue);color:#fff}
  .q{border:1px solid var(--line);border-left-width:5px;border-radius:10px;padding:13px 15px;margin-top:11px}
  .q.fatal{border-left-color:var(--red)} .q.warn{border-left-color:var(--amber)}
  .q.note{border-left-color:var(--blue)} .q.clean{border-left-color:var(--green)}
  .q .lab{font-size:12px;font-weight:800;letter-spacing:.05em;text-transform:uppercase}
  .q.fatal .lab{color:var(--red)} .q.warn .lab{color:var(--amber)} .q.note .lab{color:var(--blue)}
  .q .why{font-size:14px;color:var(--dim);margin-top:3px}
  .q .sug{font-size:14px;margin-top:5px}
  .claim{border:1px solid var(--line);border-radius:12px;padding:15px;margin-top:12px}
  .claim.flagged{background:var(--amber-soft);border-color:#E8CE95}
  label.tick{display:flex;gap:11px;align-items:flex-start;margin-top:12px;padding:11px;
    border:1px solid var(--line);border-radius:10px;background:var(--panel);cursor:pointer;font-weight:600;font-size:15px}
  label.tick input{width:21px;height:21px;flex-shrink:0;accent-color:var(--amber)}
  .runbar{display:flex;align-items:center;gap:12px;padding:11px 0;border-bottom:1px solid var(--line)}
  .runbar .t{font-variant-numeric:tabular-nums;font-weight:700}
  .qtext{font-size:21px;line-height:1.45;font-weight:500;margin-top:26px}
  .crumb{font-size:13px;color:var(--dim);display:flex;justify-content:space-between;margin-top:14px}
  .item{background:var(--panel);border-radius:9px;padding:11px 13px;margin-top:9px}
  .note-in{margin-top:6px;padding-left:10px;border-left:3px solid var(--amber)}
  .drop{border:2px dashed var(--line);border-radius:12px;padding:26px;text-align:center;margin-top:14px;color:var(--dim)}
  .drop.over{border-color:var(--blue);background:var(--blue-soft);color:var(--ink)}
  @media(max-width:520px){body{font-size:16px}h1{font-size:22px}.qtext{font-size:19px}}
</style>
</head>
<body>
<div class="wrap" id="wrap"></div>

<script>
"use strict";
/* Rules injected from questionkit/rules.json at build time. Single source of
   truth shared with the Python module and the standalone critic; CI fails if
   this copy drifts. Do not edit here. */
const SPEC = /*__RULES_JSON__*/null;
/* Interview payload, empty in the founder's copy. When the founder exports a
   file for their interviewee, a copy of THIS PAGE is written out with the
   payload filled in, which is what makes the reviewer file self-contained: the
   interviewee needs nothing but a browser. */
const PAYLOAD = /*__PAYLOAD__*/null;

const $ = id => document.getElementById(id);
const esc = s => String(s==null?"":s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const mmss = s => { s=Math.max(0,Math.round(s||0)); return Math.floor(s/60)+":"+String(s%60).padStart(2,"0"); };
const SEV = {fatal:0,warn:1,note:2};

/* ---------------- question critic (shared rules) ---------------- */
const RULES = SPEC.rules.map(r => ({s:r, re: r.pattern ? new RegExp(r.pattern,"i") : null}));
const ANCHOR = new RegExp(SPEC.rules.find(r=>r.name==="no-past-anchor").pattern,"i");
function critique(text){
  const q=(text||"").trim(), found=[], deferred=[];
  if(!q) return {findings:[],score:0,fatal:false};
  for(const {s,re} of RULES){
    let hit=false, span="";
    if(s.kind==="regex"){ const m=q.match(re); hit=!!m; span=m?m[0].trim():""; }
    else if(s.kind==="regex_absent"){ hit=!re.test(q); }
    else if(s.kind==="multi_sentence"){ const n=q.trim().split(/(?<=\?)\s+/).filter(Boolean).length; hit=n>1; span=n+" sentences"; }
    else if(s.kind==="word_count"){ const n=q.split(/\s+/).length; hit=n>s.threshold; span=n+" words"; }
    if(!hit) continue;
    const f={rule:s.name,severity:s.severity,message:s.message+(span?": “"+span+"”.":"."),why:s.why,suggestion:s.suggestion||""};
    (s.skip_if_fatal?deferred:found).push(f);
  }
  const fatal=found.some(f=>f.severity==="fatal");
  if(!fatal) found.push(...deferred);
  found.sort((a,b)=>SEV[a.severity]-SEV[b.severity]);
  return {findings:found, fatal, score: Math.max(0,100-found.reduce((s,f)=>s+SPEC.severity_penalty[f.severity],0))};
}

/* ---------------- state ---------------- */
const LS = "interview-kit-v1";
let S = {who:"", promise:"", themEmail:"", myEmail:"", questions:[], run:null, claims:[], answers:{claims:{},general:""}};
function save(){ try{ localStorage.setItem(LS, JSON.stringify(S)); }catch(e){} }
function load(){ try{ const r=localStorage.getItem(LS); if(r) S=Object.assign(S,JSON.parse(r)); }catch(e){} }

/* Hand a file to the operating system's share sheet where that exists, which on
   a phone means the founder or interviewee taps once and the file is attached to
   whatever app they choose. Everywhere else, download it and open a prefilled
   email that NAMES the file, because a page cannot attach anything to a mailto
   and cannot know where the browser put the download. Saying "attach the file"
   without naming it is how people end up sending an empty email. */
async function shareOrDownload(name, text, type, mail){
  const file = new File([text], name, {type});
  if (navigator.canShare && navigator.canShare({files:[file]})) {
    try {
      await navigator.share({files:[file], title: mail.subject, text: mail.body});
      return "shared";
    } catch (e) {
      if (e && e.name === "AbortError") return "cancelled";   // they backed out; not a failure
    }
  }
  download(name, text, type);
  const q = (o) => Object.entries(o).filter(([,v])=>v)
      .map(([k,v])=>k+"="+encodeURIComponent(v)).join("&");
  const body = mail.body + "\n\n[ Attach the file " + name + ", which has just been saved to your "
             + "downloads. It will not attach itself. ]";
  location.href = "mailto:" + encodeURIComponent(mail.to||"") + "?" + q({subject:mail.subject, body});
  return "downloaded";
}

function download(name, text, type){
  const b=new Blob([text],{type:type||"text/plain"});
  const a=document.createElement("a");
  a.href=URL.createObjectURL(b); a.download=name; a.click();
  setTimeout(()=>URL.revokeObjectURL(a.href), 4000);
}

/* ---------------- founder: 1. questions ---------------- */
function viewQuestions(){
  $("wrap").innerHTML = `
    <h1>Interview Kit</h1>
    <p class="lede">Write your questions, run the interview, then send the person you interviewed a page
    where they can strike anything they are not comfortable with.</p>
    <div class="box info"><strong>Everything happens in this page.</strong>
      <p>No account, no internet needed, nothing sent anywhere. Save this file and it works offline.
      Your work is kept in this browser, so use the same browser and do not clear its data mid-study.</p></div>
    <div class="steps"><span class="on">1. Questions</span><span>2. Interview</span><span>3. Write up</span><span>4. Send</span><span>5. Read replies</span></div>

    <label class="fld" for="who">Who are you interviewing?</label>
    <input id="who" type="text" placeholder="e.g. Sam, Acme Plumbing" value="${esc(S.who)}">
    <label class="fld" for="promise">What did you promise them? (they will see this, quote yourself)</label>
    <textarea id="promise" style="min-height:80px" placeholder="e.g. This is not a sales call, nothing goes public, and you can strike anything you like.">${esc(S.promise)}</textarea>
    <label class="fld" for="them">Their email (so the reply comes back to the right place)</label>
    <input id="them" type="text" placeholder="e.g. sam@acmeplumbing.com.au" value="${esc(S.themEmail||"")}">
    <label class="fld" for="mine">Your email</label>
    <input id="mine" type="text" placeholder="you@example.com" value="${esc(S.myEmail||"")}">
    <label class="fld" for="qs">Your questions, one per line</label>
    <textarea id="qs" style="min-height:220px" placeholder="Walk me through how you handle that today.&#10;Tell me about the last time it went wrong.">${esc(S.questions.join("\n"))}</textarea>
    <div class="row">
      <button id="check">Check my questions</button>
      <button id="ex">Load an example</button>
      <button class="primary" id="go">Start the interview</button>
    </div>
    <div id="crit"></div>`;
  const sync=()=>{ S.who=$("who").value; S.promise=$("promise").value;
    S.themEmail=$("them").value.trim(); S.myEmail=$("mine").value.trim();
    S.questions=$("qs").value.split("\n").map(x=>x.trim()).filter(Boolean); save(); };
  ["who","promise","qs","them","mine"].forEach(id=>$(id).addEventListener("input",sync));
  $("check").onclick=()=>{sync();renderCrit();};
  $("ex").onclick=()=>{ $("qs").value=[
    "Walk me through how you handle that today.",
    "Tell me about the last time it went wrong. What happened?",
    "What have you tried to fix it?",
    "Would you use a tool that did all of this for you?"].join("\n"); sync(); renderCrit(); };
  $("go").onclick=()=>{ sync(); if(!S.questions.length) return alert("Add at least one question first.");
    S.run={i:0,started:Date.now(),marks:[],notes:{}}; save(); viewRun(); };
  if(S.questions.length) renderCrit();
}
function renderCrit(){
  const out=$("crit"); out.innerHTML="";
  if(!S.questions.length) return;
  const cs=S.questions.map(critique);
  const fatal=cs.filter(c=>c.fatal).length;
  const anchored=S.questions.filter(q=>ANCHOR.test(q)).length;
  out.innerHTML = `<h2>How your questions look</h2>
    <p class="small">${S.questions.length} questions &middot; <strong>${fatal}</strong> that will waste the interview
    &middot; ${anchored} anchored in something that actually happened.</p>
    <p class="small">${esc(SPEC.limits)}</p>`;
  S.questions.forEach((q,i)=>{
    const c=cs[i], worst=c.findings.length?c.findings[0].severity:"clean";
    let h=`<div class="q ${worst}"><div><strong>${i+1}.</strong> ${esc(q)}</div>`;
    for(const f of c.findings) h+=`<div style="margin-top:9px"><div class="lab">${f.severity} &middot; ${esc(f.rule)}</div>
      <div>${esc(f.message)}</div><div class="why">${esc(f.why)}</div>`+
      (f.suggestion?`<div class="sug"><strong>Try:</strong> ${esc(f.suggestion)}</div>`:"")+`</div>`;
    if(!c.findings.length) h+=`<div class="why">Nothing flagged. Well put, which is not the same as worth asking.</div>`;
    out.insertAdjacentHTML("beforeend", h+"</div>");
  });
}

/* ---------------- founder: 2. run ---------------- */
function viewRun(){
  const r=S.run, q=S.questions[r.i], last=r.i>=S.questions.length-1;
  $("wrap").innerHTML = `
    <div class="runbar"><span class="t" id="clock">0:00</span>
      <span class="small" id="pos">${r.i+1} of ${S.questions.length}</span>
      <span style="margin-left:auto"><button id="stop" style="margin:0;padding:7px 12px">End interview</button></span></div>
    <div class="qtext">${esc(q)}</div>
    <label class="fld" for="note">Notes (these become your starting point for what they will see)</label>
    <textarea id="note" style="min-height:110px">${esc(r.notes[r.i]||"")}</textarea>
    <div class="row">
      ${r.i>0?'<button id="back">Back</button>':''}
      <button class="primary" id="next">${last?"Finish":"Next question"}</button>
    </div>
    <p class="small">Timings are recorded against each question so you can find them in your own recording later.
    Your notes are only on this device, and at the end you turn them into the points your interviewee reads.
    You get to edit every one of them first, so write freely here.</p>`;
  const tick=()=>{ const el=$("clock"); if(el) el.textContent=mmss((Date.now()-r.started)/1000); };
  clearInterval(window.__t); window.__t=setInterval(tick,500); tick();
  $("note").oninput=()=>{ r.notes[r.i]=$("note").value; save(); };
  if($("back")) $("back").onclick=()=>{ r.i--; save(); viewRun(); };
  $("next").onclick=()=>{ r.marks[r.i]=Math.round((Date.now()-r.started)/1000);
    if(last){ clearInterval(window.__t); buildClaims(); viewWrite(); } else { r.i++; save(); viewRun(); } };
  $("stop").onclick=()=>{ if(confirm("End the interview and go to the write-up?")){
    clearInterval(window.__t); buildClaims(); viewWrite(); } };
}
function buildClaims(){
  // Seed the write-up from the notes taken during the interview. The founder
  // edits these into plain statements; nothing is auto-generated from thin air.
  if(S.claims.length) return;
  S.claims = S.questions.map((q,i)=>({id:"k"+(i+1), q, at:S.run?S.run.marks[i]:null,
                                      text:(S.run&&S.run.notes[i]||"").trim()})).filter(c=>c.text);
  save();
}

/* ---------------- founder: 3. write up ---------------- */
function viewWrite(){
  $("wrap").innerHTML = `
    <h1>What you took from it</h1>
    <p class="lede">These become the points your interviewee sees, started from the notes you took.
    <strong>Read every one before you send.</strong> Rewrite them as plain statements in your own words:
    a note you scribbled mid-conversation is not something you want landing in front of the person who
    said it. Anything left blank is dropped.</p>
    <div class="steps"><span>1. Questions</span><span>2. Interview</span><span class="on">3. Write up</span><span>4. Send</span><span>5. Read replies</span></div>
    <div id="cl"></div>
    <div class="row"><button id="add">Add another point</button>
      <button class="primary" id="mk">Create the file to send them</button></div>`;
  const draw=()=>{
    const box=$("cl"); box.innerHTML="";
    S.claims.forEach((c,i)=>{
      const d=document.createElement("div"); d.className="claim";
      d.innerHTML=`<div class="small">Point ${i+1}${c.at!=null?" &middot; asked at "+mmss(c.at):""}</div>`+
                  (c.q?`<div class="small" style="margin-top:3px">From: ${esc(c.q)}</div>`:"");
      const ta=document.createElement("textarea"); ta.style.minHeight="70px"; ta.value=c.text||"";
      ta.placeholder="e.g. They schedule everything from one shared calendar.";
      ta.oninput=()=>{ c.text=ta.value; save(); };
      d.appendChild(ta); box.appendChild(d);
    });
  };
  draw();
  $("add").onclick=()=>{ S.claims.push({id:"k"+(S.claims.length+1+Date.now()%1000),q:"",at:null,text:""}); save(); draw(); };
  $("mk").onclick=()=>{ const keep=S.claims.filter(c=>(c.text||"").trim());
    if(!keep.length) return alert("Write at least one point first.");
    S.claims=keep; save(); viewSend(); };
}

/* ---------------- founder: 4. export the reviewer file ---------------- */
async function exportReviewFile(share){
  // Write out a copy of THIS page with the payload filled in. That is what makes
  // the interviewee's file self-contained: no server, no tool, no instructions
  // beyond "open this".
  const payload = {who:S.who, promise:S.promise, replyTo:S.myEmail,
                   created:new Date().toISOString().slice(0,10),
                   claims:S.claims.map(c=>({id:c.id,text:c.text,at:c.at}))};
  let src = "<!doctype html>\n" + document.documentElement.outerHTML;
  src = src.replace(/const PAYLOAD = [\s\S]*?;\n/,
                    "const PAYLOAD = " + JSON.stringify(payload).replace(/</g,"\\u003c") + ";\n");
  const safe=(S.who||"interviewee").replace(/[^a-z0-9]+/gi,"-").toLowerCase();
  const name=`review-for-${safe}.html`;
  if(!share){ download(name, src, "text/html"); return "downloaded"; }
  return shareOrDownload(name, src, "text/html", {
    to: S.themEmail,
    subject: "The interview notes, for you to check",
    body: "Here is what I took from our conversation, so you can see it before it goes anywhere.\n\n"
        + "Open the attached file in your browser, tick anything you would rather I did not use, "
        + "then press \"Save my answers\" and send the file it makes back to me. You do not need to "
        + "give a reason."});
}
function viewSend(){
  const safe=(S.who||"interviewee").replace(/[^a-z0-9]+/gi,"-").toLowerCase();
  $("wrap").innerHTML = `
    <h1>Send it to them</h1>
    <div class="steps"><span>1. Questions</span><span>2. Interview</span><span>3. Write up</span><span class="on">4. Send</span><span>5. Read replies</span></div>
    <div class="box"><strong>Ready to send: review-for-${esc(safe)}.html</strong>
      <p>On a phone, "Send it to them" hands the file straight to your share sheet. On a computer it saves the
      file and opens an email for you to attach it to, because a web page is not allowed to attach files itself.</p>
      <p>They open it, tick anything they want removed, press a button, and it comes back to you the same way.</p></div>
    <div class="box info"><strong>Suggested wording</strong>
      <blockquote id="w">Here is what I took from our conversation, so you can see it before it goes anywhere.
      Open the attached file in your browser, tick anything you would rather I did not use, then press
      "Save my answers" and email me the file it creates. You do not need to give a reason.</blockquote>
      <button id="cp">Copy that wording</button></div>
    <div class="row"><button class="primary" id="send">Send it to them</button>
      <button id="again">Just download the file</button>
      <button id="read">I have their answers, read them</button></div>
    <p class="small" id="how"></p>
    <p class="small">Their answers come back as a file. Nothing is sent anywhere by either of you.</p>`;
  $("cp").onclick=async()=>{ try{ await navigator.clipboard.writeText($("w").innerText.trim()); $("cp").textContent="Copied"; }catch(e){ $("cp").textContent="Select the text above"; } };
  $("send").onclick=async()=>{ const how=await exportReviewFile(true);
    $("how").innerHTML = how==="shared" ? "<strong>Shared.</strong>"
      : how==="cancelled" ? "Not sent."
      : "<strong>Saved and your email opened.</strong> Attach the file it names before sending.";
  };
  $("again").onclick=()=>exportReviewFile(false);
  $("read").onclick=viewRead;
}

/* ---------------- founder: 5. read their answers ---------------- */
function viewRead(){
  $("wrap").innerHTML = `
    <h1>Their answers</h1>
    <div class="steps"><span>1. Questions</span><span>2. Interview</span><span>3. Write up</span><span>4. Send</span><span class="on">5. Read replies</span></div>
    <p class="lede">Drop the answers file they emailed you, or choose it.</p>
    <div class="drop" id="drop">Drop the answers file here<br><input type="file" id="f" accept=".json,application/json" style="margin-top:10px"></div>
    <div id="res"></div>`;
  const handle=file=>{ const r=new FileReader();
    r.onload=()=>{ try{ showAnswers(JSON.parse(r.result)); }
                   catch(e){ $("res").innerHTML=`<div class="box warn">That file could not be read. It should be the file their page created, ending in .json.</div>`; } };
    r.readAsText(file); };
  $("f").onchange=e=>{ if(e.target.files[0]) handle(e.target.files[0]); };
  const d=$("drop");
  d.ondragover=e=>{e.preventDefault();d.classList.add("over");};
  d.ondragleave=()=>d.classList.remove("over");
  d.ondrop=e=>{e.preventDefault();d.classList.remove("over"); if(e.dataTransfer.files[0]) handle(e.dataTransfer.files[0]);};
}
function showAnswers(a){
  const byId=Object.fromEntries((S.claims||[]).map(c=>[c.id,c.text]));
  const flagged=[], notes=[];
  for(const [id,v] of Object.entries(a.claims||{})){
    const t=byId[id]||"(a point not in this copy of the kit)";
    if(v.flagged) flagged.push({t,note:(v.note||"").trim()}); else if((v.note||"").trim()) notes.push({t,note:v.note.trim()});
  }
  let h=`<div class="box ${flagged.length?"warn":""}"><strong>${flagged.length?flagged.length+" thing(s) to remove":"Nothing to remove"}</strong>`;
  h+=`<p class="small">From ${esc(a.who||"your interviewee")}${a.saved?", saved "+esc(a.saved.slice(0,10)):""}.</p></div>`;
  if(flagged.length){ h+=`<h2>Remove these</h2>`;
    flagged.forEach(f=>{ h+=`<div class="item">${esc(f.t)}`+(f.note?`<div class="note-in"><strong>They said:</strong> ${esc(f.note)}</div>`:"")+`</div>`; }); }
  if(notes.length){ h+=`<h2>Comments, not marked for removal</h2>`;
    notes.forEach(n=>{ h+=`<div class="item">${esc(n.t)}<div class="note-in">${esc(n.note)}</div></div>`; }); }
  if((a.general||"").trim()) h+=`<h2>General comment</h2><div class="item">${esc(a.general)}</div>`;
  $("res").innerHTML=h;
}

/* ---------------- interviewee mode ---------------- */
function viewReview(){
  const p=PAYLOAD;
  let A={claims:{},general:""};
  try{ const r=localStorage.getItem("ik-answers"); if(r) A=JSON.parse(r); }catch(e){}
  const persist=()=>{ try{ localStorage.setItem("ik-answers", JSON.stringify(A)); }catch(e){} };
  let h=`<h1>What I took from our conversation</h1>
    <p class="lede">Tick anything you would rather was not used. No explanation needed.
    ${p.who?"Prepared for "+esc(p.who)+".":""}</p>`;
  if(p.promise) h+=`<div class="box info"><strong>What you were told</strong><blockquote>${esc(p.promise)}</blockquote></div>`;
  h+=`<div class="box"><strong>Nothing here is sent anywhere.</strong>
      <p>This file runs entirely on your own computer. When you are done you press a button, it saves a small
      file, and you email that back. Nobody else sees it on the way.</p></div><div id="cl"></div>
      <h2>Anything else</h2><textarea id="gen" placeholder="Anything you want to add or correct."></textarea>
      <div class="row"><button class="primary" id="dl">Save my answers</button></div>
      <p class="small" id="st">Email the file this creates back to whoever sent you this.</p>`;
  $("wrap").innerHTML=h;
  const box=$("cl");
  (p.claims||[]).forEach((c,i)=>{
    const st=A.claims[c.id]||{};
    const d=document.createElement("div"); d.className="claim"+(st.flagged?" flagged":"");
    d.innerHTML=`<div class="small">${i+1}${c.at!=null?" &middot; "+mmss(c.at)+" into the conversation":""}</div>
                 <div style="margin-top:4px">${esc(c.text)}</div>`;
    const lab=document.createElement("label"); lab.className="tick";
    const cb=document.createElement("input"); cb.type="checkbox"; cb.checked=!!st.flagged;
    const sp=document.createElement("span"); sp.textContent="Do not use this";
    cb.onchange=()=>{ A.claims[c.id]=Object.assign({},A.claims[c.id],{flagged:cb.checked});
      d.classList.toggle("flagged",cb.checked); persist(); };
    lab.append(cb,sp); d.appendChild(lab);
    const ta=document.createElement("textarea"); ta.style.minHeight="70px"; ta.value=st.note||"";
    ta.placeholder="Optional note about this one";
    ta.oninput=()=>{ A.claims[c.id]=Object.assign({},A.claims[c.id],{note:ta.value}); persist(); };
    d.appendChild(ta); box.appendChild(d);
  });
  $("gen").value=A.general||""; $("gen").oninput=()=>{ A.general=$("gen").value; persist(); };
  $("dl").onclick=async()=>{
    const out={who:p.who, saved:new Date().toISOString(), claims:A.claims, general:A.general};
    const safe=(p.who||"answers").replace(/[^a-z0-9]+/gi,"-").toLowerCase();
    const n=Object.values(A.claims).filter(v=>v.flagged).length;
    const how=await shareOrDownload(`answers-${safe}.json`, JSON.stringify(out,null,1),
      "application/json", {
        to: p.replyTo,
        subject: "My answers on the interview notes",
        body: "Here are my answers"+(n?", I have marked "+n+" thing(s) I would rather you did not use":"")+"."});
    $("st").innerHTML = how==="shared"
      ? "<strong>Sent.</strong> You can change anything and send again."
      : how==="cancelled"
        ? "Not sent. Press the button again when you are ready."
        : "<strong>Saved.</strong> Your email should have opened. Attach the file it names, "
          + "which is in your downloads, and send. You can change anything and save again.";
  };
}

/* ---------------- boot ---------------- */
(function(){
  if(PAYLOAD) return viewReview();
  load();
  if(S.claims && S.claims.length) return viewSend();
  if(S.run) return viewRun();
  viewQuestions();
})();
</script>

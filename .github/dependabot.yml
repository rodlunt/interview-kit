version: 2
updates:
  # The tool itself has NO dependencies, by design: it is one HTML file with no
  # framework, no CDN and no package manager. The only thing here that can go
  # stale is the CI machinery, so that is the only thing Dependabot watches.
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
    commit-message:
      prefix: "chore(ci)"
    labels: ["chore"]
